memories:
  # MIPS BE: keep firmware in kseg0 (0x80000000-0x9FFFFFFF) so reset
  # and code fetches don't go through the TLB. Halucinator scratch
  # and UART live in kseg1 (0xA0000000-0xBFFFFFFF) — uncached but
  # also unmapped.
  flash:
    {base_addr: 0x80000000, file: firmware/test_irq.bin,
     permissions: r-x, size: 0x10000}
  ram:
    {base_addr: 0xA0000000, size: 0x10000, permissions: rw-}
  halucinator:
    {base_addr: 0xA0010000, size: 0x100000, permissions: rw-}
peripherals:
  logger:
    {base_addr: 0xB0000000, emulate: GenericPeripheral,
     permissions: rw-, size: 0x10000000}
