memories:
  flash:
    {base_addr: 0x00000000, file: firmware/test_irq.bin,
     permissions: r-x, size: 0x10000}
  ram:
    {base_addr: 0x40000000, size: 0x10000, permissions: rw-}
  # Required by avatar2 / configurable_machine for the halucinator
  # heap; not used directly by this firmware.
  halucinator:
    {base_addr: 0x60000000, size: 0x100000, permissions: rw-}
  # GICv2 distributor + cpu interface modelled as plain RW memory
  # so the firmware's MMIO writes succeed and the IrqController can
  # write back GICD_ISPENDR for inject_irq. No real GIC peripheral
  # is wired here (none of the in-tree backends model one) — the
  # firmware reads back its own writes, which is enough for the
  # boot-and-poll path.
  gicd:
    {base_addr: 0x08000000, size: 0x1000, permissions: rw-}
  gicc:
    {base_addr: 0x08010000, size: 0x1000, permissions: rw-}
peripherals:
  logger:
    {base_addr: 0x50000000, emulate: GenericPeripheral,
     permissions: rw-, size: 0x10000000}
