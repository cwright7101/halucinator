# STM32F4 (Cortex-M4) memory map for the P2IM Reflow_Oven firmware (auto-modeling path).
machine:
  arch: cortex-m3
  cpu_model: cortex-m3
  entry_addr: 0x08001be9
  init_sp: 0x20005000
  vector_base: 0x08000000

memories:
  alias:
    base_addr: 0x0
    file: Reflow.bin
    permissions: r-x
    size: 0x100000
  flash:
    base_addr: 0x08000000
    file: Reflow.bin
    permissions: r-x
    size: 0x100000
  ram:
    base_addr: 0x20000000
    size: 0x20000
  halucinator-irq: {base_addr: 0x3ffc000, size: 0x4000}
  halucinator: {base_addr: 0x04000000, size: 0x100000}

peripherals:
  logger:
    base_addr: 0x40000000
    emulate: AutoPeripheral
    permissions: rw-
    size: 0x20000000
